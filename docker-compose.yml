# Desarrollo: `docker compose up -d db` y luego `npm run db:migrate` (con DATABASE_URL de .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alerta
      POSTGRES_PASSWORD: alerta
      POSTGRES_DB: alerta
    ports:
      - "5432:5432"
    volumes:
      - ./db/migrations:/migrations:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerta -d alerta"]
      interval: 3s
      timeout: 3s
      retries: 15

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://alerta:alerta@db:5432/alerta
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
